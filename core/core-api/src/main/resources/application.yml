spring.application.name: core-api
spring.profiles.active: local

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - monitoring.yml
      - logging.yml
      - db-core.yml
      - client-example.yml
      - s3.yml
  web.resources.add-mappings: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  tomcat:
    max-connections: 20000
    threads:
      max: 600
      min-spare: 100

# JWT 토큰 설정
jwt:
  secret: ${JWT_SECRET:ark-secret-key-for-jwt-token-generation-and-validation-please-change-in-production}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000} # 1시간 (밀리초)
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7일 (밀리초)

---
spring.config.activate.on-profile: local


---
spring.config.activate.on-profile: local-dev


---
spring.config.activate.on-profile: dev


---
spring.config.activate.on-profile: staging


---
spring.config.activate.on-profile: live


name: PR CD

on:
  push:
    branches: [ main, ARK-008 ] # ARK-008은 테스트용 머지전에 삭제
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ARK-008'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r tools/* deploy/

      - name: Deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/ark-deploy/"

      - name: Update services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          script: |
            cd /home/ubuntu/ark-deploy/deploy
            
            # Pull latest images and restart only changed services
            docker compose pull
            
            # Restart services (only changed ones will be updated)
            docker compose up -d
            
            # Wait for health checks (max 5 minutes)
            echo "Waiting for services to become healthy..."
            healthy_count=0
            for i in {1..30}; do
              sleep 10
              healthy_count=0
              for s in mysql redis minio; do
                [ "$(docker inspect ark-$s --format '{{.State.Health.Status}}' 2>/dev/null)" = "healthy" ] && healthy_count=$((healthy_count+1))
              done
              [ $healthy_count -eq 3 ] && break
            done
            
            # Verify and show status
            docker compose ps
            for s in mysql redis minio; do
              status=$(docker inspect ark-$s --format '{{.State.Status}}' 2>/dev/null || echo "not-found")
              health=$(docker inspect ark-$s --format '{{.State.Health.Status}}' 2>/dev/null || echo "no-healthcheck")
              
              if [ "$status" != "running" ]; then
                echo "Error: ark-$s is not running (status: $status)" && exit 1
              fi
              if [ "$health" != "healthy" ] && [ "$health" != "no-healthcheck" ]; then
                echo "Error: ark-$s is not healthy ($health)" && exit 1
              fi
            done
            echo "All services are healthy!"
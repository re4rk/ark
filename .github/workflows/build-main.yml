name: Build Main

on:
  push:
    branches: [ main, ARK-010 ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKER_HUB_USERNAME }}/ark
          tags: |
            type=raw,value=latest,enable=true

      - name: Build Spring Boot JAR
        run: ./gradlew :core:core-api:bootJar --no-daemon --parallel

      - name: Build and push Docker image (fast ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/ark:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKER_HUB_USERNAME }}/ark:buildcache,mode=max
          provenance: false

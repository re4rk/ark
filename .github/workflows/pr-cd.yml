name: PR CD

on:
  push:
    branches: [ main, ARK-008 ] # ARK-008은 테스트용 머지전에 삭제
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build application
        run: ./gradlew build -x test

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r core/core-api/build/libs/*.jar deploy/
          cp -r clients/client-example/build/libs/*.jar deploy/
          cp -r clients/client-s3/build/libs/*.jar deploy/
          cp docker-compose.yml deploy/

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          script: |
            # Create deployment directory
            mkdir -p /home/ubuntu/ark-deploy
            
            # Stop existing services
            cd /home/ubuntu/ark-deploy
            if [ -f docker-compose.yml ]; then
              docker-compose down
            fi
            
            # Clean up old files
            rm -rf /home/ubuntu/ark-deploy/*

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/ark-deploy/"

      - name: Start services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          script: |
            cd /home/ubuntu/ark-deploy
            
            # Start services with docker-compose
            docker-compose up -d --build
            
            # Wait for services to be ready
            sleep 30
            
            # Check if services are running
            docker-compose ps
            
            # Health check
            echo "Deployment completed successfully!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi

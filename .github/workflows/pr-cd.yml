name: PR CD

on:
  push:
    branches: [ main, ARK-008 ] # ARK-008은 테스트용 머지전에 삭제
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ARK-008'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r tools/* deploy/

      - name: Deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/ark-deploy/"

      - name: Update services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          script: |
            cd /home/ubuntu/ark-deploy/deploy
            
            # Pull latest images and restart only changed services
            docker compose pull
            
            # Restart services (only changed ones will be updated)
            docker compose up -d
            
            # Wait for all services to be healthy using Docker Compose health checks
            echo "Waiting for all services to be healthy..."
            
            # Wait for all services to reach healthy state
            timeout 120 bash -c 'until docker compose ps --format "table {{.Name}}\t{{.Status}}" | grep -q "healthy"; do
              echo "Waiting for services to be healthy..."
              docker compose ps --format "table {{.Name}}\t{{.Status}}"
              sleep 5
            done'
            
            # Final health check - ensure all services are healthy
            echo "Final health check..."
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
            
            # Verify all services are healthy
            unhealthy_services=$(docker compose ps --format "{{.Name}} {{.Status}}" | grep -v "healthy" | grep -v "unhealthy" | wc -l)
            if [ "$unhealthy_services" -gt 0 ]; then
              echo "Some services are not healthy:"
              docker compose ps --format "table {{.Name}}\t{{.Status}}" | grep -v "healthy"
              exit 1
            fi
            
            echo "All services are healthy! Deployment completed successfully!"

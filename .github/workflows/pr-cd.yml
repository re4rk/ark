name: PR CD

on:
  push:
    branches: [ main, ARK-008 ] # ARK-008은 테스트용 머지전에 삭제
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ARK-008'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r tools/* deploy/

      - name: Deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/ark-deploy/"

      - name: Update services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.ARK_SSH_KEY }}
          script: |
            cd /home/ubuntu/ark-deploy
            
            # Pull latest images and restart only changed services
            docker compose pull
            
            # Restart services (only changed ones will be updated)
            docker compose up -d
            
            # Wait for services to be ready
            echo "Waiting for services to be ready..."
            
            # Wait for MySQL to be ready
            echo "Waiting for MySQL to be ready..."
            if ! timeout 60 bash -c 'until docker compose exec mysql mysqladmin ping -h localhost --silent; do sleep 2; done'; then
              echo "MySQL failed to start within 60 seconds"
              exit 1
            fi
            echo "MySQL is ready!"
            
            # Wait for Redis to be ready
            echo "Waiting for Redis to be ready..."
            if ! timeout 30 bash -c 'until docker compose exec redis redis-cli ping | grep -q PONG; do sleep 2; done'; then
              echo "Redis failed to start within 30 seconds"
              exit 1
            fi
            echo "Redis is ready!"
            
            # Wait for MinIO to be ready
            echo "Waiting for MinIO to be ready..."
            if ! timeout 30 bash -c 'until curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1; do sleep 2; done'; then
              echo "MinIO failed to start within 30 seconds"
              exit 1
            fi
            echo "MinIO is ready!"
            
            # Check if all services are running
            echo "Checking service status..."
            docker compose ps
            
            # Verify all services are healthy
            echo "Performing health checks..."
            
            # Check MySQL
            if ! docker compose exec mysql mysqladmin ping -h localhost --silent; then
              echo "MySQL health check failed"
              exit 1
            fi
            
            # Check Redis
            if ! docker compose exec redis redis-cli ping | grep -q PONG; then
              echo "Redis health check failed"
              exit 1
            fi
            
            # Check MinIO
            if ! curl -f http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO health check failed"
              exit 1
            fi
            
            echo "All services are healthy! Deployment completed successfully!"

version: "3.9"

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ark-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
    driver: local


